<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: Roboto, sans-serif;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body style="background-color: #b9b9b9; color: black;">
    <div style="text-align: center; width: 550px; margin: auto auto; background: white; padding: 12px; ">
        <div style="text-align: center;">
            <p style="font-size: 22px;  font-weight: 600; margin:auto; text-transform: capitalize;">
                Hola @user
            </p>
            <p style="font-weight: 500; font-size:  18px;">Tu registro fue exitoso</p>
            <p>Creada el @day, @date </p>
        </div>
        <div style="background-color: #d6d6d6; border-radius: 6px;">
            <p>Tus accesos son los siguientes:</p>
            <p>Correo:@mail</p>
            <p>Contraseña:@password</p>
        </div>

    </div>
</body>

</html>
